schema: spec-driven

context: |
  成果物の本文は日本語で記述する。OpenSpecの構文として必要な見出しや
  SHALL・MUSTなどのキーワード、コードの識別子は原形を保つ。
  一度の変更で扱う修正・機能追加は一つに限定する。
  資料を先に更新し、不具合の再現・回帰テスト、最小実装、動作確認の順で進める。
  PHP 8.2との互換性を維持し、不要な後方互換・データ移行コードは追加しない。
  実運用の設定・DB・投稿画像は変更せず、検証には一時ディレクトリを使う。
  既存の開発方針はAGENTS.md、検証手順はdocs/development.mdを参照する。
  既存資料と矛盾する仕様や、コード・テストで確認していない現状の要件を作らない。

rules:
  proposal:
    - 解決する問題、変更範囲、対象外を明示し、独立した修正・機能追加を混在させない。
    - 既存の仕様とdocs/の関連資料を確認し、新規仕様と既存仕様の変更を区別する。
  specs:
    - 利用者から観測できる振る舞いを要件とし、正常系・境界・拒否時の結果をシナリオで示す。
    - 対象に応じて、認証・CSRF・公開状態、画像なし・通常画像・NSFW、両テーマへの影響を確認する。
    - 未登録の既存機能を仕様化する場合は既存資料・実装・テストを根拠とし、推測で要件を追加しない。
  design:
    - 既存のApplicationContext・サービス・コントローラーと検証経路を再利用し、不要な抽象化や新たなグローバル状態を設けない。
    - テーマ変更はedaとmonoreitaを同等に扱い、設定変更は既定値・設置者向け設定例・ローダー検証を揃える。
    - 画像の削除・置換はImageServiceで関連ファイルも扱い、認証・セッション・CSRFの既存経路を迂回しない。
  tasks:
    - 資料更新、不具合の再現・回帰テスト、最小実装、動作確認を依存順に並べる。
    - 実装詳細の固定や配線だけのテストを増やさず、受け入れ条件を検証する。
    - 変更に応じたPHP構文検査・スモークテスト・両テーマ診断を含め、HTTP・投稿・DBの変更には結合テストを含める。
    - README.mdとchangelog.mdの履歴更新を含め、実行結果を確認するまで検証タスクを完了にしない。

operations:
  apply:
    guidance:
      - アプリ本体の実装前に関連資料と受け入れ条件を確認し、必要な更新を先に行う。
      - テストに加えて実際の変更経路を動かし、実運用データを使わずに結果を確認する。
  archive:
    guidance:
      - 未完了タスクや未検証の受け入れ条件を残したまま完了扱いにしない。
      - 仕様差分と実装の整合性を確認し、仕様へ同期してからアーカイブする。
